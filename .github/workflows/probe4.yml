4

# ОДИН ФАЙЛ. Что выясняем:
# 1) служба GoogleChromeElevationService зарегистрирована — а есть ли её exe на месте?
#    (в прошлом прогоне elevation_service.exe в каталоге Chrome не было)
# 2) полный список файлов каталога Chrome;
# 3) долгий обычный запуск (45 с) с корректным закрытием и чтением БД ПОСЛЕ закрытия;
# 4) появляется ли app_bound_encrypted_key и какие теги в cookies.
# Куда: .github/workflows/probe4.yml   Запуск: Actions -> probe4 -> Run workflow

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OSLABEL: ${{ matrix.os }}
    steps:
      - name: 1 - sluzhba i fayly
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "=== ШАГ 1 ==="
          try {
            $svc = Get-CimInstance Win32_Service -Filter "Name='GoogleChromeElevationService'" -ErrorAction SilentlyContinue
            if ($svc) {
              "служба      : " + $svc.Name + " | " + $svc.State + " | " + $svc.StartMode
              "PathName    : " + $svc.PathName
              $exe = ($svc.PathName -replace '^"([^"]+)".*$', '$1')
              "exe существует: " + (Test-Path $exe)
            } else { "служба GoogleChromeElevationService не найдена" }
            $dir = "$env:ProgramFiles\Google\Chrome\Application"
            "---- каталог $dir ----"
            Get-ChildItem $dir -File -ErrorAction SilentlyContinue |
              Select-Object Name, Length | Sort-Object Name | Format-Table -AutoSize | Out-String
            "---- версии в подкаталогах ----"
            Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            foreach ($v in (Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue)) {
              $e = Join-Path $v.FullName "elevation_service.exe"
              "  {0,-14} elevation_service.exe: {1}" -f $v.Name, (Test-Path $e)
            }
          } catch {
            "ОШИБКА в шаге 1: " + $_.Exception.Message
            "строка: " + $_.InvocationInfo.ScriptLineNumber + " -> " + $_.InvocationInfo.Line
          } finally { "=== шаг 1 завершён ===" }

      - name: 2 - obychnyy zapusk 45s
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "=== ШАГ 2 ==="
          $prof = "$env:RUNNER_TEMP\p4"
          try {
            Remove-Item -Recurse -Force $prof -ErrorAction SilentlyContinue
            $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
            $p = Start-Process -FilePath $chrome -PassThru -ErrorAction Stop -ArgumentList @(
              "--user-data-dir=$prof", "--no-first-run", "--no-default-browser-check",
              "https://www.google.com/", "https://example.com/"
            )
            "запущен pid " + $p.Id
            Start-Sleep -Seconds 45
            "окон: " + @(Get-Process chrome -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }).Count
          } catch {
            "ОШИБКА запуска: " + $_.Exception.Message
          } finally {
            # закрываем ВСЕ процессы, у которых в командной строке наш профиль
            # (у дочерних процессов Path = Program Files, поэтому фильтр по Path не работал)
            $killed = 0
            Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like "*$prof*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue; $killed++ }
            "закрыто процессов: $killed"
            Start-Sleep -Seconds 6
            "осталось процессов с нашим профилем: " + @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -like "*$prof*" }).Count
          }

      - name: 3 - chtenie posle zakrytiya
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "=== ШАГ 3 ==="
          $prof = "$env:RUNNER_TEMP\p4"
          $ls = "$prof\Local State"
          "Local State есть: " + (Test-Path $ls)
          if (Test-Path $ls) {
            $c = (Get-Content $ls -Raw | ConvertFrom-Json).os_crypt
            "os_crypt        : " + (($c.PSObject.Properties.Name) -join ", ")
            "app_bound есть  : " + [bool]$c.app_bound_encrypted_key
            foreach ($pp in $c.PSObject.Properties) {
              $r = [Convert]::FromBase64String($pp.Value)
              "   {0,-24} {1,5} Б  '{2}'" -f $pp.Name, $r.Length, [Text.Encoding]::ASCII.GetString($r[0..[Math]::Min(3,$r.Length-1)])
            }
          }
          foreach ($rel in @("Default\Network\Cookies", "Default\Login Data")) {
            $p = Join-Path $prof $rel
            if (-not (Test-Path $p)) { "{0} : нет файла" -f $rel; continue }
            $ok = $false
            for ($try = 1; $try -le 5 -and -not $ok; $try++) {
              try {
                $b = [IO.File]::ReadAllBytes($p)
                $line = "{0} : {1} Б |" -f $rel, $b.Length
                foreach ($t in @("v10", "v11", "v20")) {
                  $pat = [Text.Encoding]::ASCII.GetBytes($t); $n = 0
                  for ($i = 0; $i -le $b.Length - 3; $i++) {
                    if ($b[$i] -eq $pat[0] -and $b[$i+1] -eq $pat[1] -and $b[$i+2] -eq $pat[2]) { $n++ }
                  }
                  $line = $line + " " + $t + "=" + $n
                }
                $line
                $ok = $true
              } catch {
                "попытка $try : файл занят, ждём"
                Start-Sleep -Seconds 5
              }
            }
            if (-not $ok) { "{0} : прочитать не удалось" -f $rel }
          }
